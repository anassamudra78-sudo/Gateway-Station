<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Gateway - Absensi</title>
    <!-- Ikon Khusus Terminal Absen -->
    <link rel="icon" type="image/png" sizes="192x192" href="logo-absen.png">
    <link rel="apple-touch-icon" href="logo-absen.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Smart Gateway">
    <meta name="application-name" content="Smart Gateway">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #scanner-container { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; background: #000; border-radius: 0.75rem; overflow: hidden; position: relative; }
        #videoFeed { width: 100%; max-width: 640px; text-align: center; }
        #videoFeed__dashboard { display: none !important; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        #toast-notif { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; padding: 15px 25px; font-weight: 800; font-size: 1.1rem; border-radius: 12px; z-index: 50; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 80%; }
        /* Warna background untuk mode full screen */
        :fullscreen { background-color: #0f172a; }
        ::backdrop { background-color: #0f172a; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col overflow-hidden relative">
    
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 py-4 px-8 flex justify-between items-center z-10 shadow-lg">
        <div class="flex items-center gap-4">
            <div class="bg-emerald-500 w-12 h-12 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/30">
                <i class="fa-solid fa-shield-halved text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white">SMART TEACHER</h1>
                <p class="text-emerald-400 font-semibold text-sm tracking-widest uppercase">Gateway Station (Final Pro)</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4 md:gap-6">
            <!-- TOMBOL LAYAR PENUH MURNI -->
            <button onclick="toggleFullScreen()" id="btn-fs" class="bg-indigo-500 hover:bg-indigo-400 text-white px-4 py-2 rounded-lg font-bold shadow-lg shadow-indigo-500/30 transition-all flex items-center gap-2 active:scale-95">
                <i class="fa-solid fa-expand" id="icon-fs"></i> <span class="hidden md:inline" id="text-fs">Layar Penuh</span>
            </button>
            
            <div class="text-right hidden md:block border-l border-slate-700 pl-4 md:pl-6">
                <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Status Sistem</p>
                <p id="ai-status" class="text-amber-400 font-bold text-sm flex items-center justify-end gap-2">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Menunggu...
                </p>
            </div>
        </div>
    </header>

    <main class="flex-1 flex p-6 gap-6 h-full">
        <!-- AREA KAMERA -->
        <section class="flex-[3] flex flex-col gap-4 relative">
            <div class="bg-slate-800 rounded-2xl border border-slate-700 p-4 flex-1 flex flex-col relative shadow-2xl">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-bold text-slate-200"><i class="fa-solid fa-camera-viewfinder text-emerald-400 mr-2"></i> Pemindai Utama</h2>
                    <span id="face-db-status" class="text-xs font-bold bg-indigo-600 text-white px-3 py-1 rounded-full shadow-lg"><i class="fa-solid fa-hard-drive mr-1"></i> 0 Wajah Tersimpan</span>
                </div>
                
                <div id="scanner-container">
                    <div id="live-face-status" class="absolute top-4 left-4 bg-slate-900/80 text-white text-xs px-3 py-2 rounded-lg border border-slate-600 z-50 shadow-lg font-bold">
                        <i class="fa-solid fa-eye-slash text-slate-400"></i> Radar AI Offline
                    </div>
                    
                    <div id="toast-notif"></div>
                    <div id="videoFeed"></div>
                </div>

                <div id="camera-loading" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900/95 rounded-2xl m-4">
                    <button onclick="mulaiSistem()" id="btn-start" class="bg-emerald-500 text-white px-8 py-4 rounded-xl font-extrabold shadow-lg hover:scale-105 transition-transform">
                        <i class="fa-solid fa-power-off mr-2"></i> NYALAKAN SISTEM
                    </button>
                    <p class="mt-4 text-indigo-400 text-sm font-bold text-center"><i class="fa-solid fa-shield-check mr-1"></i> Anti-Spam & DB Permanen Aktif</p>
                </div>
            </div>
        </section>

        <!-- AREA LOG DATA -->
        <section class="flex-[2] flex flex-col gap-4">
            <div class="bg-slate-800 rounded-2xl border border-slate-700 p-5 flex-1 flex flex-col shadow-2xl">
                <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
                    <h2 class="font-bold text-slate-200 text-lg"><i class="fa-solid fa-list-check text-emerald-400 mr-2"></i> Log Kehadiran</h2>
                    <span class="bg-slate-700 text-slate-300 text-xs font-bold py-1 px-3 rounded-full" id="total-scan">0 Terpindai</span>
                </div>
                <div id="log-container" class="flex-1 overflow-y-auto space-y-3 pr-2"></div>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>

    <script>
        const cameraLoading = document.getElementById('camera-loading');
        const logContainer = document.getElementById('log-container');
        const totalScan = document.getElementById('total-scan');
        const btnStart = document.getElementById('btn-start');
        const aiStatus = document.getElementById('ai-status');
        const faceDbStatus = document.getElementById('face-db-status');
        const toastNotif = document.getElementById('toast-notif');
        const liveFaceStatus = document.getElementById('live-face-status');
        
        let scanCount = 0;
        let registeredDescriptors = [];
        let faceMatcher = null;
        let isFaceEngineRunning = false;
        let toastTimeout;
        
        window.pendingRegistration = null;
        
        // VARIABEL ANTI-SPAM
        const sudahAbsenHariIni = new Set();
        const toastCooldown = {}; 

        const dataSiswaDummy = {
            "QR-12345": { nama: "Muh Nashir", kelas: "IX-B", foto: "https://ui-avatars.com/api/?name=Muh+Nashir&background=10b981&color=fff" },
            "QR-67890": { nama: "Raisya", kelas: "VII-A", foto: "https://ui-avatars.com/api/?name=Raisya&background=3b82f6&color=fff" }
        };

        // FUNGSI LAYAR PENUH (FULL SCREEN)
        function toggleFullScreen() {
            const iconFs = document.getElementById('icon-fs');
            const textFs = document.getElementById('text-fs');
            
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    iconFs.classList.replace('fa-expand', 'fa-compress');
                    textFs.innerText = "Keluar Penuh";
                }).catch(err => {
                    console.log(`Gagal Fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen().then(() => {
                    iconFs.classList.replace('fa-compress', 'fa-expand');
                    textFs.innerText = "Layar Penuh";
                });
            }
        }

        // Event Listener jika keluar layar penuh dengan tombol back/esc perangkat
        document.addEventListener('fullscreenchange', () => {
            const iconFs = document.getElementById('icon-fs');
            const textFs = document.getElementById('text-fs');
            if (!document.fullscreenElement) {
                iconFs.classList.replace('fa-compress', 'fa-expand');
                textFs.innerText = "Layar Penuh";
            }
        });

        // FUNGSI MEMORI PERMANEN (DATABASE LOKAL)
        function simpanWajahKeMemori() {
            const dataToSave = registeredDescriptors.map(d => ({
                label: d.label,
                descriptors: d.descriptors.map(desc => Array.from(desc))
            }));
            localStorage.setItem('SmartTeacher_FaceDB', JSON.stringify(dataToSave));
            faceDbStatus.innerHTML = `<i class="fa-solid fa-hard-drive mr-1"></i> ${registeredDescriptors.length} Wajah Tersimpan`;
        }

        function muatWajahDariMemori() {
            const storedData = localStorage.getItem('SmartTeacher_FaceDB');
            if (storedData) {
                const parsedData = JSON.parse(storedData);
                registeredDescriptors = parsedData.map(d => {
                    const descriptors = d.descriptors.map(desc => new Float32Array(desc));
                    return new faceapi.LabeledFaceDescriptors(d.label, descriptors);
                });
                
                if (registeredDescriptors.length > 0) {
                    faceMatcher = new faceapi.FaceMatcher(registeredDescriptors, 0.55);
                    faceDbStatus.innerHTML = `<i class="fa-solid fa-hard-drive mr-1"></i> ${registeredDescriptors.length} Wajah Tersimpan`;
                }
            }
        }

        function showToast(message, color = "rgba(245, 158, 11, 0.95)", duration = 4000) {
            clearTimeout(toastTimeout);
            toastNotif.innerHTML = message;
            toastNotif.style.background = color;
            toastNotif.style.display = 'block';
            toastTimeout = setTimeout(() => { toastNotif.style.display = 'none'; }, duration);
        }

        function tambahLogKehadiran(namaLengkap, metode = "QR", warnaMetode = "text-emerald-400") {
            let siswa = Object.values(dataSiswaDummy).find(s => s.nama === namaLengkap) || { nama: namaLengkap, kelas: "Terdaftar", foto: `https://ui-avatars.com/api/?name=${namaLengkap}&background=f59e0b&color=fff` };
            
            const sekarang = new Date();
            const waktu = sekarang.getHours().toString().padStart(2, '0') + ':' + sekarang.getMinutes().toString().padStart(2, '0');
            
            const logItem = document.createElement('div');
            logItem.className = "bg-slate-700/50 border border-emerald-500/30 rounded-xl p-4 flex items-center gap-4 shadow-md";
            logItem.innerHTML = `
                <img src="${siswa.foto}" class="w-12 h-12 rounded-full border-2 border-emerald-500">
                <div class="flex-1">
                    <h3 class="font-bold text-white">${siswa.nama}</h3>
                    <p class="text-slate-400 text-xs">Kelas ${siswa.kelas}</p>
                </div>
                <div class="text-right">
                    <p class="text-emerald-400 font-black text-lg">${waktu}</p>
                    <p class="text-[10px] uppercase font-bold ${warnaMetode}">${metode}</p>
                </div>
            `;
            logContainer.insertBefore(logItem, logContainer.firstChild);
            scanCount++;
            totalScan.textContent = `${scanCount} Terpindai`;
            new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play().catch(e=>console.log(e));
        }

        async function mulaiSistem() {
            btnStart.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memuat Mesin...`;
            btnStart.disabled = true;

            try {
                aiStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyiapkan Data...`;
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                
                muatWajahDariMemori();
                aiStatus.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-shield-check"></i> Mesin Aktif</span>`;

                const html5QrCode = new Html5Qrcode("videoFeed");
                await html5QrCode.start(
                    { facingMode: "user" },
                    { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.333334, formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ] },
                    (decodedText) => {
                        if (!window.lastScanned || window.lastScanned !== decodedText) {
                            window.lastScanned = decodedText;
                            const namaSiswa = dataSiswaDummy[decodedText] ? dataSiswaDummy[decodedText].nama : decodedText;
                            const isRegistered = registeredDescriptors.some(d => d.label === namaSiswa);

                            if (!isRegistered) {
                                window.pendingRegistration = namaSiswa;
                                showToast(`QR: ${namaSiswa} <br>SINGKIRKAN HP & Tatap Kamera!`, "rgba(245, 158, 11, 0.95)", 10000);
                                setTimeout(() => { window.pendingRegistration = null; }, 10000);
                            } else {
                                // ANTI-SPAM UNTUK QR CODE
                                if (!sudahAbsenHariIni.has(namaSiswa)) {
                                    sudahAbsenHariIni.add(namaSiswa);
                                    tambahLogKehadiran(namaSiswa, "QR ABSEN");
                                    showToast(`<i class="fa-solid fa-circle-check text-4xl mb-2"></i><br>ABSEN SUKSES:<br>${namaSiswa.toUpperCase()}`, "rgba(16, 185, 129, 0.95)", 3000);
                                } else {
                                    showToast(`<i class="fa-solid fa-circle-exclamation text-4xl mb-2"></i><br>${namaSiswa.toUpperCase()}<br>SUDAH TERABSEN HARI INI!`, "rgba(59, 130, 246, 0.95)", 3000);
                                }
                            }
                            setTimeout(() => { window.lastScanned = null; }, 4000);
                        }
                    },
                    (errorMessage) => {}
                );

                cameraLoading.style.display = 'none';

                const pantauKamera = setInterval(() => {
                    const videoEl = document.querySelector('video');
                    if (videoEl && videoEl.videoWidth > 0) {
                        clearInterval(pantauKamera);
                        aktifkanRadarWajah(videoEl);
                    }
                }, 500);

                function aktifkanRadarWajah(videoEl) {
                    try {
                        const canvas = faceapi.createCanvasFromMedia(videoEl);
                        document.getElementById('scanner-container').append(canvas);

                        async function jalankanRadar() {
                            if (isFaceEngineRunning) return;
                            isFaceEngineRunning = true;

                            try {
                                const displaySize = { width: videoEl.clientWidth, height: videoEl.clientHeight };
                                canvas.width = displaySize.width;
                                canvas.height = displaySize.height;

                                const detections = await faceapi.detectAllFaces(videoEl, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.3 }))
                                    .withFaceLandmarks()
                                    .withFaceDescriptors();

                                const resizedDetections = faceapi.resizeResults(detections, displaySize);
                                const ctx = canvas.getContext('2d');
                                ctx.clearRect(0, 0, canvas.width, canvas.height);
                                faceapi.draw.drawDetections(canvas, resizedDetections);

                                if (detections.length > 0) {
                                    liveFaceStatus.innerHTML = `<i class="fa-solid fa-expand text-emerald-400"></i> ${detections.length} Wajah Terlihat`;
                                    
                                    const currentFaceDescriptor = detections[0].descriptor;

                                    if (window.pendingRegistration) {
                                        const newLabeledDescriptor = new faceapi.LabeledFaceDescriptors(window.pendingRegistration, [currentFaceDescriptor]);
                                        registeredDescriptors.push(newLabeledDescriptor);
                                        faceMatcher = new faceapi.FaceMatcher(registeredDescriptors, 0.55);
                                        
                                        simpanWajahKeMemori();
                                        sudahAbsenHariIni.add(window.pendingRegistration); // Langsung masuk absen
                                        
                                        showToast(`<i class="fa-solid fa-circle-check text-4xl mb-2"></i><br>WAJAH ${window.pendingRegistration.toUpperCase()}<br>TERSAMBUNG!`, "rgba(16, 185, 129, 0.95)", 3000);
                                        tambahLogKehadiran(window.pendingRegistration, "REGISTRASI BARU", "text-amber-400");
                                        window.pendingRegistration = null;
                                    } 
                                    else if (faceMatcher) {
                                        const bestMatch = faceMatcher.findBestMatch(currentFaceDescriptor);
                                        if (bestMatch.label !== 'unknown' && bestMatch.distance < 0.55) {
                                            const namaDikenali = bestMatch.label;
                                            
                                            // LOGIKA ANTI-SPAM UNTUK WAJAH
                                            if (!sudahAbsenHariIni.has(namaDikenali)) {
                                                sudahAbsenHariIni.add(namaDikenali);
                                                tambahLogKehadiran(namaDikenali, "FACE ID", "text-indigo-400");
                                                showToast(`<i class="fa-solid fa-circle-check text-4xl mb-2"></i><br>ABSEN SUKSES:<br>${namaDikenali.toUpperCase()}`, "rgba(16, 185, 129, 0.95)", 3000);
                                            } else {
                                                const now = Date.now();
                                                if (!toastCooldown[namaDikenali] || now - toastCooldown[namaDikenali] > 6000) { 
                                                    showToast(`<i class="fa-solid fa-circle-exclamation text-4xl mb-2"></i><br>${namaDikenali.toUpperCase()}<br>SUDAH TERABSEN HARI INI!`, "rgba(59, 130, 246, 0.95)", 3000);
                                                    toastCooldown[namaDikenali] = now;
                                                }
                                            }

                                            const drawBox = new faceapi.draw.DrawBox(resizedDetections[0].detection.box, { label: namaDikenali });
                                            drawBox.draw(canvas);
                                        }
                                    }
                                } else {
                                    liveFaceStatus.innerHTML = `<i class="fa-solid fa-user-xmark text-rose-400"></i> Tidak Ada Wajah`;
                                }
                            } catch (err) {}

                            isFaceEngineRunning = false;
                            setTimeout(jalankanRadar, 400); 
                        }

                        jalankanRadar(); 
                    } catch(e) {}
                }

            } catch (err) {
                btnStart.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> ERROR!`;
                btnStart.disabled = false;
                btnStart.classList.replace('bg-emerald-500', 'bg-rose-500');
            }
        }
    </script>
</body>
</html>
