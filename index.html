<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART GATEWAY: Universal Station</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .scan-line {
            width: 100%; height: 2px;
            background: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
            position: absolute; animation: scan 3s infinite linear;
        }
        @keyframes scan { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        /* Memastikan canvas face-api menumpuk pas di atas video */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col overflow-hidden">
    
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 py-4 px-8 flex justify-between items-center z-10 shadow-lg">
        <div class="flex items-center gap-4">
            <div class="bg-emerald-500 w-12 h-12 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/30">
                <i class="fa-solid fa-graduation-cap text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white">SMART GATEWAY</h1>
                <p class="text-emerald-400 font-semibold text-sm tracking-widest uppercase">Universal Station (Auto Enroll)</p>
            </div>
        </div>
        <div class="text-right hidden md:block">
            <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Status AI</p>
            <p id="ai-status" class="text-amber-400 font-bold text-sm flex items-center justify-end gap-2">
                <i class="fa-solid fa-brain"></i> Menunggu Modul...
            </p>
        </div>
    </header>

    <main class="flex-1 flex p-6 gap-6 h-full">
        <!-- AREA KAMERA -->
        <section class="flex-[3] flex flex-col gap-4">
            <div class="bg-slate-800 rounded-2xl border border-slate-700 p-4 flex-1 flex flex-col relative shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-slate-200"><i class="fa-solid fa-camera-viewfinder text-emerald-400 mr-2"></i> Pemindai Wajah & QR</h2>
                    
                    <!-- KOTAK INFO WAJAH TERDAFTAR -->
                    <div class="bg-blue-500/20 border border-blue-500/30 text-blue-400 text-xs font-bold py-1.5 px-3 rounded-full flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-users-viewfinder"></i>
                        <span id="info-wajah-terdaftar">0 Wajah Terdaftar</span>
                    </div>
                </div>
                
                <div class="relative w-full h-[65%] bg-black rounded-xl overflow-hidden flex items-center justify-center border-2 border-slate-700">
                    
                    <!-- Wadah Kamera -->
                    <div id="videoFeed" class="absolute top-0 left-0 w-full h-full overflow-hidden"></div>
                    
                    <!-- Garis Pindai -->
                    <div class="scan-line hidden" id="scan-line-anim"></div>

                    <!-- TOMBOL PEMANCING KAMERA -->
                    <div id="camera-loading" class="absolute z-30 flex flex-col items-center justify-center w-full h-full bg-slate-900/90">
                        <button onclick="mulaiSistem()" id="btn-start" class="bg-emerald-500 text-white px-8 py-4 rounded-xl font-extrabold shadow-lg shadow-emerald-500/30 mb-4 hover:scale-105 active:scale-95 transition-transform">
                            <i class="fa-solid fa-power-off mr-2"></i> NYALAKAN SISTEM
                        </button>
                        <p id="error-text" class="font-semibold text-sm text-center px-4 text-slate-400">Pastikan Anda sudah mengizinkan akses kamera di browser.</p>
                    </div>
                </div>

                <!-- PANEL PENDAFTARAN WAJAH OTOMATIS (BARU) -->
                <div class="mt-4 bg-slate-900 p-4 border border-blue-500/30 rounded-xl flex gap-3 items-center shadow-inner">
                    <div class="bg-blue-500 w-10 h-10 rounded-lg flex items-center justify-center shadow-md">
                        <i class="fa-solid fa-qrcode text-white"></i>
                    </div>
                    <input type="text" id="input-enroll-id" readonly placeholder="Scan QR siswa untuk mengaktifkan perekaman wajah..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-amber-400 font-bold focus:outline-none cursor-not-allowed">
                    <button onclick="mulaiDaftarWajah()" id="btn-rekam" disabled class="bg-slate-700 text-slate-500 font-bold py-2 px-6 rounded-lg transition-transform shadow-lg cursor-not-allowed">
                        REKAM WAJAH
                    </button>
                </div>
            </div>
        </section>

        <!-- AREA LOG DATA -->
        <section class="flex-[2] flex flex-col gap-4">
            <div class="bg-slate-800 rounded-2xl border border-slate-700 p-5 flex-1 flex flex-col shadow-2xl">
                <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
                    <h2 class="font-bold text-slate-200 text-lg"><i class="fa-solid fa-list-check text-emerald-400 mr-2"></i> Log Kehadiran</h2>
                    <span class="bg-slate-700 text-slate-300 text-xs font-bold py-1 px-3 rounded-full" id="total-scan">0 Terpindai</span>
                </div>
                <div id="log-container" class="flex-1 overflow-y-auto space-y-3 pr-2"></div>
            </div>
        </section>
    </main>

    <!-- Library 1: QR Code -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Library 2: Face API (Otak AI) -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>

    <script>
        const cameraLoading = document.getElementById('camera-loading');
        const logContainer = document.getElementById('log-container');
        const totalScan = document.getElementById('total-scan');
        const errorText = document.getElementById('error-text');
        const btnStart = document.getElementById('btn-start');
        const scanLine = document.getElementById('scan-line-anim');
        const aiStatus = document.getElementById('ai-status');
        
        let scanCount = 0;
        let isEnrolling = false;
        let enrollTargetId = "";
        let faceMatcher = null; // Menunggu sinkronisasi wajah dari pusat

        // URL SAKTI DATABASE PUSAT
        const URL_GATEWAY_PUSAT = "https://script.google.com/macros/s/AKfycbzcHLMR_oS83RcSUucJ5PWEkD7MxIAkNf_vQ-tDOHaUeJ-AelGf0KmPZTCW9EGyEHxJ/exec";

       // Fungsi Cetak Kehadiran (Dengan Parsing UI yang Elegan)
async function tambahLogKehadiran(qrData, metode = "QR") {
    const sekarang = new Date();
    const waktu = sekarang.getHours().toString().padStart(2, '0') + ':' + sekarang.getMinutes().toString().padStart(2, '0');
    
    // PEMECAHAN DATA: NIS | Nama | Kelas
    const parts = qrData.split('|');
    const nis = parts[0] || qrData;
    const nama = parts[1] || "Siswa";
    const kelas = parts[2] || "-";

    const logItem = document.createElement('div');
    logItem.className = "bg-slate-700/50 border border-emerald-500/30 rounded-xl p-4 flex items-center gap-4 transform transition-all duration-300 shadow-md fade-in";
    logItem.innerHTML = `
        <div class="w-12 h-12 rounded-full bg-emerald-500 flex items-center justify-center text-white font-bold"><i class="fa-solid fa-check-double"></i></div>
        <div class="flex-1">
            <h3 class="font-black text-white text-md uppercase tracking-wide">${nama}</h3>
            <p class="text-emerald-400 text-[11px] font-bold">NIS: ${nis} &nbsp;|&nbsp; KELAS: ${kelas}</p>
        </div>
        <div class="text-right">
            <p class="text-emerald-400 font-black text-lg">${waktu}</p>
            <p class="text-slate-400 text-[9px] uppercase font-bold tracking-wider">via ${metode}</p>
        </div>
    `;
    logContainer.insertBefore(logItem, logContainer.firstChild);

    // Suara sukses
    new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play().catch(e=>console.log(e));

    try {
        // Kirim NIS murni ke backend Apps Script
        await fetch(`${URL_GATEWAY_PUSAT}?action=insertLog&qr=${encodeURIComponent(nis)}&metode=${encodeURIComponent(metode)}`, {
            method: 'GET',
            mode: 'no-cors'
        });
        
        scanCount++;
        totalScan.textContent = `${scanCount} Hadir`;
    } catch (error) {
        console.error("Gagal kirim background:", error);
    }
}

// Fungsi Menolak Absen Ganda (Munculkan Peringatan Merah di Layar)
function tolakAbsenGanda(qrData) {
    // Pecah data untuk mengambil Nama Siswa
    const parts = qrData.split('|');
    const nama = parts[1] || "Siswa";
    
    // Buat elemen visual notifikasi ditolak
    const logItem = document.createElement('div');
    logItem.className = "bg-rose-950/80 border border-rose-500/50 rounded-xl p-4 flex items-center gap-4 transform transition-all duration-300 shadow-md animate-shake fade-in";
    logItem.innerHTML = `
        <div class="w-12 h-12 rounded-full bg-rose-500 flex items-center justify-center text-white font-bold"><i class="fa-solid fa-hand text-xl"></i></div>
        <div class="flex-1">
            <h3 class="font-black text-rose-300 text-sm tracking-wide">SUDAH ABSEN HARI INI!</h3>
            <p class="text-white text-xs font-bold uppercase mt-0.5">${nama}</p>
        </div>
    `;
    logContainer.insertBefore(logItem, logContainer.firstChild);
    
    // Bunyikan Suara Error / Ditolak (Bip Rendah)
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = 150;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
    } catch(e) { console.log(e); }

    // Hapus notifikasi merah secara otomatis setelah 4 detik agar layar tidak penuh
    setTimeout(() => { 
        logItem.style.opacity = '0';
        setTimeout(() => logItem.remove(), 300);
    }, 4000);
}

        // Fungsi Tombol Pendaftaran Wajah
        function mulaiDaftarWajah() {
            const inputId = document.getElementById('input-enroll-id').value;
            if(!inputId) return;
            enrollTargetId = inputId;
            isEnrolling = true;
            
            const btnRekam = document.getElementById('btn-rekam');
            btnRekam.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> MENATAP KAMERA...`;
            btnRekam.className = "bg-amber-500 text-white font-bold py-2 px-6 rounded-lg transition-transform shadow-lg";
        }

        // Fungsi Pengiriman Sidik Wajah
        async function kirimSidikWajahKePusat(idSiswa, descriptor) {
            const arrayWajah = Array.from(descriptor).map(n => parseFloat(n.toFixed(4)));
            const dataString = JSON.stringify(arrayWajah);
            
            try {
                tambahLogKehadiran(idSiswa, "DAFTAR WAJAH");
                await fetch(`${URL_GATEWAY_PUSAT}?action=enrollFace&id=${encodeURIComponent(idSiswa)}&faceData=${encodeURIComponent(dataString)}`, {
                    method: 'GET',
                    mode: 'no-cors'
                });
                alert(`Mantap! Sidik Wajah untuk ID: ${idSiswa} berhasil dikirim ke Pusat!`);
            } catch (err) {
                alert("Gagal mengirim data wajah ke Pusat. Cek koneksi internet!");
            }
        }
// Fungsi Mengunduh Hafalan Wajah dari Pusat (Bersih & Final)
        async function muatDaftarWajah() {
            try {
                document.getElementById('info-wajah-terdaftar').innerText = "Memuat database...";
                
                const response = await fetch(`${URL_GATEWAY_PUSAT}?action=getFaces`, {
                    method: 'GET',
                    redirect: "follow"
                });
                const dataWajah = await response.json();
                
                if (dataWajah && dataWajah.length > 0) {
                    const labeledDescriptors = [];
                    
                    for (const data of dataWajah) {
                        if(data.descriptor) {
                            const descriptorArray = new Float32Array(JSON.parse(data.descriptor));
                            const labeledDescriptor = new faceapi.LabeledFaceDescriptors(String(data.id), [descriptorArray]);
                            labeledDescriptors.push(labeledDescriptor);
                        }
                    }
                    
                    if(labeledDescriptors.length > 0) {
                        faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
                        document.getElementById('info-wajah-terdaftar').innerHTML = `<i class="fa-solid fa-users-viewfinder"></i> ${labeledDescriptors.length} Wajah Terdaftar`;
                    } else {
                        document.getElementById('info-wajah-terdaftar').innerHTML = `<i class="fa-solid fa-users-viewfinder"></i> 0 Wajah Terdaftar`;
                    }
                } else {
                    document.getElementById('info-wajah-terdaftar').innerHTML = `<i class="fa-solid fa-users-viewfinder"></i> 0 Wajah Terdaftar`;
                }
            } catch (error) {
                console.log("Info Database:", error);
                document.getElementById('info-wajah-terdaftar').innerHTML = `<i class="fa-solid fa-users-viewfinder"></i> 0 Wajah Terdaftar`;
            }
        }
        // Fungsi Utama Menyalakan Sistem
        async function mulaiSistem() {
            btnStart.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Menginisiasi AI...`;
            btnStart.disabled = true;

            try {
                // 1. Muat Model AI
                aiStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memuat Model Wajah...`;
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                aiStatus.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-brain"></i> AI Aktif & Siap</span>`;
await muatDaftarWajah(); 
                // 2. Nyalakan Kamera untuk QR
                const html5QrCode = new Html5Qrcode("videoFeed");
                await html5QrCode.start(
                    { facingMode: "user" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText) => {
                        if (!window.lastScanned || window.lastScanned !== decodedText) {
                            window.lastScanned = decodedText;
                            
                            // ALUR FINAL: Masukkan hasil QR otomatis ke Panel Daftar
                            const inputEnroll = document.getElementById('input-enroll-id');
                            if (inputEnroll) {
                                inputEnroll.value = decodedText;
                                const btnRekam = document.getElementById('btn-rekam');
                                btnRekam.disabled = false;
                                btnRekam.className = "bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-lg transition-transform hover:scale-105 active:scale-95 shadow-lg shadow-blue-500/30 cursor-pointer";
                                btnRekam.innerText = "REKAM WAJAH";
                            }

                            tambahLogKehadiran(decodedText, "QR");
                            setTimeout(() => { window.lastScanned = null; }, 3000);
                        }
                    },
                    (errorMessage) => { }
                );

                // 3. UI Sukses
                cameraLoading.style.display = 'none';
                scanLine.classList.remove('hidden');

                // 4. Proses Deteksi Wajah AI
                const videoEl = document.querySelector('#videoFeed video');
                if (videoEl) {
                    videoEl.addEventListener('playing', () => {
                        const canvas = faceapi.createCanvasFromMedia(videoEl);
                        document.getElementById('videoFeed').append(canvas);
                        const displaySize = { width: videoEl.videoWidth, height: videoEl.videoHeight };
                        faceapi.matchDimensions(canvas, displaySize);

                        setInterval(async () => {
                            // Ekstrak Face Descriptors
                            const detections = await faceapi.detectAllFaces(videoEl, new faceapi.TinyFaceDetectorOptions())
                                .withFaceLandmarks()
                                .withFaceDescriptors();
                                
                            const resizedDetections = faceapi.resizeResults(detections, displaySize);
                            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
                            faceapi.draw.drawDetections(canvas, resizedDetections);
                            
                            if (detections.length > 0 && !window.faceScanned) {
                                window.faceScanned = true;
                                const sidikWajah = detections[0].descriptor;

                                // JIKA SEDANG MEREKAM WAJAH BARU
                                if (isEnrolling) {
                                    kirimSidikWajahKePusat(enrollTargetId, sidikWajah);
                                    isEnrolling = false; 
                                    
                                    // Kunci kembali UI Pendaftaran
                                    const inputEnroll = document.getElementById('input-enroll-id');
                                    inputEnroll.value = "";
                                    const btnRekam = document.getElementById('btn-rekam');
                                    btnRekam.disabled = true;
                                    btnRekam.className = "bg-slate-700 text-slate-500 font-bold py-2 px-6 rounded-lg transition-transform shadow-lg cursor-not-allowed";
                                    btnRekam.innerText = "REKAM WAJAH";
                                } 
                                // JIKA MODE DETEKSI BIASA
                                else {
                                    if (faceMatcher) {
                                    const bestMatch = faceMatcher.findBestMatch(sidikWajah);
                                    if (bestMatch.label !== "unknown") {
                                        
                                        const dataMentahQR = bestMatch.label; // Format: NIS|Nama|Kelas
                                        const nisSiswa = dataMentahQR.split('|')[0];
                                        const hariIni = new Date().toISOString().split('T')[0];
                                        
                                        // Cek memori harian di Gateway
                                        let logHarian = JSON.parse(localStorage.getItem('gateway_absen_' + hariIni) || '[]');
                                        
                                        if (logHarian.includes(nisSiswa)) {
                                            // JIKA SUDAH ABSEN HARI INI -> TOLAK MENTAH-MENTAH
                                            tolakAbsenGanda(dataMentahQR);
                                        } else {
                                            // JIKA BELUM ABSEN -> CATAT KE MEMORI LOKAL & KIRIM
                                            logHarian.push(nisSiswa);
                                            localStorage.setItem('gateway_absen_' + hariIni, JSON.stringify(logHarian));
                                            
                                            tambahLogKehadiran(dataMentahQR, "Face AI");
                                        }
                                    }
                                }

                                setTimeout(() => { window.faceScanned = false; }, 4000);
                            }
                        }, 150);
                    });
                }

            } catch (err) {
                btnStart.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> COBA LAGI`;
                btnStart.disabled = false;
                btnStart.classList.replace('bg-emerald-500', 'bg-rose-500');
                errorText.innerHTML = `<span class="text-rose-400 font-bold block mt-2 text-lg">ERROR: ${err.name || err.message || err}</span>`;
            }
        }
    </script>
</body>
</html>
