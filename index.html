<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART GATEWAY: Universal Station</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .scan-line {
            width: 100%; height: 2px;
            background: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
            position: absolute; animation: scan 3s infinite linear;
        }
        @keyframes scan { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        
        /* Tombol Mode Aktif */
        .mode-btn { transition: all 0.3s ease; }
        .mode-active { background: rgba(16, 185, 129, 0.2); border-color: rgb(16, 185, 129); color: rgb(52, 211, 153); box-shadow: inset 0 0 10px rgba(16, 185, 129, 0.2); }
        .mode-inactive { background: rgba(30, 41, 59, 0.8); border-color: rgba(51, 65, 85, 0.5); color: rgb(148, 163, 184); }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col overflow-hidden">
    
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 py-4 px-8 flex justify-between items-center z-10 shadow-lg">
        <div class="flex items-center gap-4">
            <div class="bg-emerald-500 w-12 h-12 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/30">
                <i class="fa-solid fa-graduation-cap text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white">SMART GATEWAY</h1>
                <p id="teks-mode-judul" class="text-emerald-400 font-semibold text-sm tracking-widest uppercase">Universal Station (Mode Absensi)</p>
            </div>
        </div>

        <!-- SAKLAR MODE UTAMA -->
        <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-700/50 shadow-inner">
            <button onclick="switchMode('absen')" id="btn-mode-absen" class="mode-btn mode-active px-5 py-2 rounded-lg font-bold text-sm flex items-center gap-2">
                <i class="fa-solid fa-check-to-slot"></i> Absen Harian
            </button>
            <button onclick="switchMode('daftar')" id="btn-mode-daftar" class="mode-btn mode-inactive px-5 py-2 rounded-lg font-bold text-sm flex items-center gap-2">
                <i class="fa-solid fa-user-plus"></i> Daftar Wajah
            </button>
        </div>

        <div class="flex items-center gap-5">
            <div class="text-right hidden md:block">
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-wider">Status AI</p>
                <p id="ai-status" class="text-amber-400 font-bold text-sm flex items-center justify-end gap-2">
                    <i class="fa-solid fa-brain"></i> Menunggu Modul...
                </p>
            </div>
            <button onclick="toggleFullScreenGateway()" title="Layar Penuh" class="bg-slate-700/50 hover:bg-slate-600 text-slate-300 hover:text-white border border-slate-600 w-11 h-11 rounded-xl flex items-center justify-center transition-all shadow-sm">
                <i id="fs-icon" class="fa-solid fa-expand text-lg"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex p-6 gap-6 h-full">
        <!-- AREA KAMERA -->
        <section class="flex-[3] flex flex-col gap-4">
            <div class="bg-slate-800 rounded-2xl border border-slate-700 p-4 flex-1 flex flex-col relative shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-slate-200" id="teks-kamera-judul"><i class="fa-solid fa-camera-viewfinder text-emerald-400 mr-2"></i> Pemindai Wajah Harian</h2>
                    
                    <!-- KOTAK INFO WAJAH (Disembunyikan di Mode Absen, Muncul di Mode Daftar) -->
                    <button id="btn-info-wajah" onclick="bukaModalDaftarWajah()" class="hidden bg-blue-500/20 hover:bg-blue-500/40 border border-blue-500/30 text-blue-400 text-xs font-bold py-2 px-4 rounded-full items-center gap-2 shadow-sm transition-all cursor-pointer hover:scale-105">
                        <i class="fa-solid fa-users-viewfinder"></i>
                        <span id="info-wajah-terdaftar">0 Wajah Terdaftar</span>
                    </button>
                </div>
                
                <div class="relative w-full h-[65%] bg-black rounded-xl overflow-hidden flex items-center justify-center border-2 border-slate-700">
                    <div id="videoFeed" class="absolute top-0 left-0 w-full h-full overflow-hidden"></div>
                    <div class="scan-line hidden" id="scan-line-anim"></div>
                    <div id="camera-loading" class="absolute z-30 flex flex-col items-center justify-center w-full h-full bg-slate-900/90">
                        <button onclick="mulaiSistem()" id="btn-start" class="bg-emerald-500 text-white px-8 py-4 rounded-xl font-extrabold shadow-lg shadow-emerald-500/30 mb-4 hover:scale-105 active:scale-95 transition-transform">
                            <i class="fa-solid fa-power-off mr-2"></i> NYALAKAN SISTEM
                        </button>
                        <p id="error-text" class="font-semibold text-sm text-center px-4 text-slate-400">Pastikan Anda sudah mengizinkan akses kamera di browser.</p>
                    </div>
                </div>

                <!-- PANEL PENDAFTARAN WAJAH (Disembunyikan di Mode Absen, Muncul di Mode Daftar) -->
                <div id="panel-pendaftaran" class="hidden mt-4 bg-slate-900 p-4 border border-blue-500/30 rounded-xl gap-3 items-center shadow-inner">
                    <div class="bg-blue-500 w-10 h-10 rounded-lg flex items-center justify-center shadow-md shrink-0">
                        <i class="fa-solid fa-qrcode text-white"></i>
                    </div>
                    <input type="text" id="input-enroll-id" readonly placeholder="Scan QR Siswa Baru untuk mengaktifkan tombol rekam..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-amber-400 font-bold focus:outline-none cursor-not-allowed">
                    <button onclick="mulaiDaftarWajah()" id="btn-rekam" disabled class="bg-slate-700 text-slate-500 font-bold py-2 px-6 rounded-lg transition-transform shadow-lg cursor-not-allowed shrink-0">
                        REKAM WAJAH
                    </button>
                </div>
                
                <!-- PESAN MODE ABSEN -->
                <div id="pesan-mode-absen" class="mt-4 bg-emerald-900/20 p-4 border border-emerald-500/30 rounded-xl flex gap-3 items-center shadow-inner">
                    <i class="fa-solid fa-circle-info text-emerald-500"></i>
                    <p class="text-sm text-emerald-400 font-semibold">Mode Absensi Aktif. Wajah akan otomatis direkam sebagai kehadiran. Jika AI gagal, gunakan QR Code.</p>
                </div>
            </div>
        </section>

        <!-- AREA LOG DATA -->
        <section class="flex-[2] flex flex-col gap-4">
            <div class="bg-slate-800 rounded-2xl border border-slate-700 p-5 flex-1 flex flex-col shadow-2xl">
                <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
                    <h2 class="font-bold text-slate-200 text-lg"><i class="fa-solid fa-list-check text-emerald-400 mr-2"></i> Log Kehadiran</h2>
                    <span class="bg-slate-700 text-slate-300 text-xs font-bold py-1 px-3 rounded-full" id="total-scan">0 Terpindai</span>
                </div>
                <div id="log-container" class="flex-1 overflow-y-auto space-y-3 pr-2"></div>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>

<script>
        const cameraLoading = document.getElementById('camera-loading');
        const logContainer = document.getElementById('log-container');
        const totalScan = document.getElementById('total-scan');
        const errorText = document.getElementById('error-text');
        const btnStart = document.getElementById('btn-start');
        const scanLine = document.getElementById('scan-line-anim');
        const aiStatus = document.getElementById('ai-status');
        
        // VARIABEL STATE SISTEM
        let currentMode = 'absen'; // 'absen' atau 'daftar'
        let scanCount = 0;
        let isEnrolling = false;
        let enrollTargetId = "";
        let faceMatcher = null; 
        let globalDataWajah = [];
        const URL_GATEWAY_PUSAT = "https://script.google.com/macros/s/AKfycbzcHLMR_oS83RcSUucJ5PWEkD7MxIAkNf_vQ-tDOHaUeJ-AelGf0KmPZTCW9EGyEHxJ/exec";

        // ==========================================
        // FUNGSI GANTI MODE (ABSEN VS DAFTAR)
        // ==========================================
        function switchMode(mode) {
            currentMode = mode;
            const btnAbsen = document.getElementById('btn-mode-absen');
            const btnDaftar = document.getElementById('btn-mode-daftar');
            const judulKamera = document.getElementById('teks-kamera-judul');
            const teksJudul = document.getElementById('teks-mode-judul');
            
            const btnInfoWajah = document.getElementById('btn-info-wajah');
            const panelPendaftaran = document.getElementById('panel-pendaftaran');
            const pesanAbsen = document.getElementById('pesan-mode-absen');
            
            if (mode === 'absen') {
                btnAbsen.className = "mode-btn mode-active px-5 py-2 rounded-lg font-bold text-sm flex items-center gap-2";
                btnDaftar.className = "mode-btn mode-inactive px-5 py-2 rounded-lg font-bold text-sm flex items-center gap-2 hover:bg-slate-700/50";
                judulKamera.innerHTML = '<i class="fa-solid fa-camera-viewfinder text-emerald-400 mr-2"></i> Pemindai Wajah Harian';
                teksJudul.innerText = "Universal Station (Mode Absensi)";
                teksJudul.className = "text-emerald-400 font-semibold text-sm tracking-widest uppercase";
                
                btnInfoWajah.style.display = 'none';
                panelPendaftaran.style.display = 'none';
                pesanAbsen.style.display = 'flex';
                
            } else if (mode === 'daftar') {
                btnDaftar.className = "mode-btn mode-active px-5 py-2 rounded-lg font-bold text-sm flex items-center gap-2 !border-blue-500 !bg-blue-500/20 !text-blue-400 !shadow-[inset_0_0_10px_rgba(59,130,246,0.2)]";
                btnAbsen.className = "mode-btn mode-inactive px-5 py-2 rounded-lg font-bold text-sm flex items-center gap-2 hover:bg-slate-700/50";
                judulKamera.innerHTML = '<i class="fa-solid fa-user-plus text-blue-400 mr-2"></i> Mode Pendaftaran Wajah Baru';
                teksJudul.innerText = "Universal Station (Mode Pendaftaran)";
                teksJudul.className = "text-blue-400 font-semibold text-sm tracking-widest uppercase";
                
                btnInfoWajah.style.display = 'flex';
                panelPendaftaran.style.display = 'flex';
                pesanAbsen.style.display = 'none';
            }
        }

        // ==========================================
        // LOG KEHADIRAN & AUDIO
        // ==========================================
        async function tambahLogKehadiran(qrData, metode = "QR") {
            const sekarang = new Date();
            const waktu = sekarang.getHours().toString().padStart(2, '0') + ':' + sekarang.getMinutes().toString().padStart(2, '0');
            const parts = qrData.split('|');
            const nis = parts[0] || qrData;
            const nama = parts[1] || "Siswa";
            const kelas = parts[2] || "-";
            const logId = 'log_' + Date.now();

            const logItem = document.createElement('div');
            logItem.id = logId;
            logItem.className = "bg-slate-700/50 border border-amber-500/30 rounded-xl p-4 flex items-center gap-4 transform transition-all duration-300 shadow-md fade-in";
            logItem.innerHTML = `
                <div id="icon_${logId}" class="w-12 h-12 rounded-full bg-amber-500 flex items-center justify-center text-white font-bold shadow-lg shadow-amber-500/30"><i class="fa-solid fa-spinner fa-spin text-xl"></i></div>
                <div class="flex-1">
                    <h3 class="font-black text-white text-md uppercase tracking-wide">${nama}</h3>
                    <p id="teks_${logId}" class="text-amber-400 text-[11px] font-bold animate-pulse">MENGIRIM KE CLOUD...</p>
                </div>
                <div class="text-right">
                    <p id="waktu_${logId}" class="text-amber-400 font-black text-lg">${waktu}</p>
                    <p class="text-slate-400 text-[9px] uppercase font-bold tracking-wider">via ${metode}</p>
                </div>
            `;
            logContainer.insertBefore(logItem, logContainer.firstChild);

            try { new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play().catch(e=>console.log(e)); } catch(e) {}

            try {
                await fetch(`${URL_GATEWAY_PUSAT}?action=insertLog&qr=${encodeURIComponent(nis)}&metode=${encodeURIComponent(metode)}`, { method: 'GET', mode: 'no-cors' });
                const logEl = document.getElementById(logId);
                if(logEl) {
                    logEl.className = "bg-slate-700/50 border border-emerald-500/30 rounded-xl p-4 flex items-center gap-4 transform transition-all duration-300 shadow-md fade-in";
                    document.getElementById(`icon_${logId}`).className = "w-12 h-12 rounded-full bg-emerald-500 flex items-center justify-center text-white font-bold shadow-lg shadow-emerald-500/30";
                    document.getElementById(`icon_${logId}`).innerHTML = `<i class="fa-solid fa-check-double text-xl"></i>`;
                    document.getElementById(`teks_${logId}`).className = "text-emerald-400 text-[11px] font-bold";
                    document.getElementById(`teks_${logId}`).innerHTML = `NIS: ${nis} &nbsp;|&nbsp; KELAS: ${kelas}`;
                    document.getElementById(`waktu_${logId}`).className = "text-emerald-400 font-black text-lg";
                }
                scanCount++;
                totalScan.textContent = `${scanCount} Hadir`;
            } catch (error) {
                const logEl = document.getElementById(logId);
                if(logEl) {
                    logEl.className = "bg-rose-950/40 border border-rose-500/50 rounded-xl p-4 flex items-center gap-4 transform transition-all duration-300 shadow-md fade-in";
                    document.getElementById(`icon_${logId}`).className = "w-12 h-12 rounded-full bg-rose-600 flex items-center justify-center text-white font-bold shadow-lg shadow-rose-600/30";
                    document.getElementById(`icon_${logId}`).innerHTML = `<i class="fa-solid fa-triangle-exclamation text-xl"></i>`;
                    document.getElementById(`teks_${logId}`).className = "text-rose-400 text-[11px] font-black";
                    document.getElementById(`teks_${logId}`).innerHTML = `<i class="fa-solid fa-wifi mr-1"></i> GAGAL CLOUD (OFFLINE)`;
                    document.getElementById(`waktu_${logId}`).className = "text-rose-500 font-black text-lg opacity-50 line-through";
                    
                    const nowLocal = new Date();
                    const hariIni = nowLocal.getFullYear() + '-' + String(nowLocal.getMonth() + 1).padStart(2, '0') + '-' + String(nowLocal.getDate()).padStart(2, '0');
                    let logHarian = JSON.parse(localStorage.getItem('gateway_absen_' + hariIni) || '[]');
                    logHarian = logHarian.filter(id => id !== nis);
                    localStorage.setItem('gateway_absen_' + hariIni, JSON.stringify(logHarian));
                }
            }
        }
        
        let gatewayAudioCtx = null;
        function getGatewayAudioCtx() {
            if (!gatewayAudioCtx) gatewayAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (gatewayAudioCtx.state === 'suspended') gatewayAudioCtx.resume();
            return gatewayAudioCtx;
        }

        function tolakAbsenGanda(qrData) {
            const parts = qrData.split('|');
            const nama = parts[1] || "Siswa";
            const oldToast = document.getElementById('toast-ganda');
            if(oldToast) oldToast.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-ganda';
            toast.className = "fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-950/80 backdrop-blur-xl border border-rose-500/50 text-white px-6 py-4 rounded-3xl shadow-[0_15px_40px_rgba(225,29,72,0.4)] z-[9999] flex items-center gap-4 transition-all duration-500 translate-y-[-150%] opacity-0";
            toast.innerHTML = `
                <div class="w-12 h-12 rounded-full bg-rose-500/20 flex items-center justify-center border border-rose-500/40 shrink-0">
                    <i class="fa-solid fa-hand text-rose-400 text-2xl animate-pulse"></i>
                </div>
                <div class="text-left flex-1 min-w-[200px]">
                    <h3 class="font-black text-[11px] tracking-widest text-rose-400 uppercase">Telah Hadir Hari Ini</h3>
                    <p class="text-base font-bold text-white truncate">${nama}</p>
                </div>
            `;
            document.body.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-[-150%]', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
            });
            
            try {
                const ctx = getGatewayAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = 150;
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}

            setTimeout(() => { 
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-150%]', 'opacity-0');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // ==========================================
        // FUNGSI PENDAFTARAN WAJAH
        // ==========================================
        function mulaiDaftarWajah() {
            const inputId = document.getElementById('input-enroll-id').value;
            if(!inputId) return;
            enrollTargetId = inputId;
            isEnrolling = true;
            
            const btnRekam = document.getElementById('btn-rekam');
            btnRekam.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> MENATAP KAMERA...`;
            btnRekam.className = "bg-amber-500 text-white font-bold py-2 px-6 rounded-lg transition-transform shadow-lg";
        }

        async function kirimSidikWajahKePusat(idSiswa, descriptor) {
            const arrayWajah = Array.from(descriptor).map(n => parseFloat(n.toFixed(4)));
            const dataString = JSON.stringify(arrayWajah);
            
            try {
                await fetch(`${URL_GATEWAY_PUSAT}?action=enrollFace&id=${encodeURIComponent(idSiswa)}&faceData=${encodeURIComponent(dataString)}`, { method: 'GET', mode: 'no-cors' });
                alert(`Mantap! Sidik Wajah untuk ID: ${idSiswa} berhasil dikirim ke Pusat!`);
                
                // Minta sistem refresh memori wajah terbaru dari server
                await muatDaftarWajah();
            } catch (err) {
                alert("Gagal mengirim data wajah ke Pusat. Cek koneksi internet!");
            }
        }

        // ==========================================
        // MANAJEMEN DATABASE WAJAH
        // ==========================================
        async function muatDaftarWajah() {
            try {
                const infoWajah = document.getElementById('info-wajah-terdaftar');
                infoWajah.innerText = "Memuat database...";
                
                const response = await fetch(`${URL_GATEWAY_PUSAT}?action=getFaces`, { method: 'GET', redirect: "follow" });
                const dataWajah = await response.json();
                globalDataWajah = dataWajah;
                
                if (dataWajah && dataWajah.length > 0) {
                    const labeledDescriptors = [];
                    for (const data of dataWajah) {
                        if(data.descriptor) {
                            const descriptorArray = new Float32Array(JSON.parse(data.descriptor));
                            labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(String(data.id), [descriptorArray]));
                        }
                    }
                    if(labeledDescriptors.length > 0) {
                        faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.35);
                        infoWajah.innerHTML = `${labeledDescriptors.length} Wajah Terdaftar`;
                    } else {
                        infoWajah.innerHTML = `0 Wajah Terdaftar`;
                    }
                } else {
                    infoWajah.innerHTML = `0 Wajah Terdaftar`;
                }
            } catch (error) {
                document.getElementById('info-wajah-terdaftar').innerHTML = `0 Wajah Terdaftar`;
            }
        }
        
        function bukaModalDaftarWajah() {
            let modal = document.getElementById('modal-list-wajah');
            if(!modal) {
                const modalHtml = `
                <div id="modal-list-wajah" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[9999] flex items-center justify-center p-4 fade-in">
                    <div class="bg-slate-900 border border-slate-700 rounded-[2rem] p-6 w-full max-w-md shadow-2xl relative max-h-[85vh] flex flex-col">
                        <button onclick="document.getElementById('modal-list-wajah').style.display='none'" class="absolute top-5 right-5 text-slate-500 hover:text-rose-500 transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
                        <h3 class="text-xl font-black text-white mb-2"><i class="fa-solid fa-users-viewfinder text-blue-400 mr-2"></i>Kelola Wajah Terdaftar</h3>
                        <p class="text-xs text-slate-400 mb-5 border-b border-slate-700 pb-4">Lihat daftar siswa dan hapus pendaftaran wajahnya jika terjadi kesalahan.</p>
                        <div id="modal-list-content" class="overflow-y-auto pr-2 flex-1"></div>
                    </div>
                </div>`;
                document.body.insertAdjacentHTML('beforeend', modalHtml);
                modal = document.getElementById('modal-list-wajah');
            } else {
                modal.style.display = 'flex';
            }

            const contentContainer = document.getElementById('modal-list-content');
            if(!globalDataWajah || globalDataWajah.length === 0) {
                contentContainer.innerHTML = `<p class="text-center text-slate-400 text-sm py-10">Belum ada data wajah terdaftar atau sedang dimuat...</p>`;
            } else {
                contentContainer.innerHTML = globalDataWajah.map((w) => {
                    let parts = String(w.id || "").split('|');
                    let nisUser = parts[0] || w.id;
                    let namaUser = parts[1] || "Siswa";
                    let kelasUser = parts[2] || "-";
                    return `
                        <div class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700 mb-3 hover:border-blue-500/50 transition-colors">
                            <div>
                                <p class="text-white font-black text-sm uppercase">${namaUser}</p>
                                <p class="text-emerald-400 text-xs font-bold mt-0.5">NIS: ${nisUser} &nbsp;|&nbsp; Kelas: ${kelasUser}</p>
                            </div>
                            <button onclick="hapusWajahSatu('${w.id}', this)" class="bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white p-3 rounded-xl transition-all">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                }).join('');
            }
        }
        
        async function hapusWajahSatu(idHapus, btnElement) {
            if(confirm("Yakin ingin menghapus wajah ini dari sistem? Siswa harus daftar ulang wajahnya.")) {
                btnElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
                try {
                    await fetch(`${URL_GATEWAY_PUSAT}?action=deleteFaceSingle&id=${encodeURIComponent(idHapus)}`, { method: 'GET', mode: 'no-cors' });
                    alert("Berhasil dihapus dari server pusat!");
                    document.getElementById('modal-list-wajah').remove();
                    await muatDaftarWajah();
                } catch(e) {
                    alert("Gagal menghapus. Periksa internet.");
                    btnElement.innerHTML = `<i class="fa-solid fa-trash-can"></i>`;
                }
            }
        }

        // ==========================================
        // MESIN AI & QR UTAMA
        // ==========================================
        async function mulaiSistem() {
            btnStart.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Menginisiasi AI...`;
            btnStart.disabled = true;

            try {
                aiStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memuat Model Wajah...`;
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                aiStatus.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-brain"></i> AI Aktif & Siap</span>`;
                await muatDaftarWajah(); 
                
                const html5QrCode = new Html5Qrcode("videoFeed");
                await html5QrCode.start(
                    { facingMode: "user" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText) => {
                        if (!window.lastScanned || window.lastScanned !== decodedText) {
                            window.lastScanned = decodedText;
                            
                            // LOGIKA PINTAR QR BERDASARKAN MODE
                            if (currentMode === 'daftar') {
                                // MODE DAFTAR: QR hanya buka gembok tombol Rekam Wajah (Tidak Absen)
                                const inputEnroll = document.getElementById('input-enroll-id');
                                if (inputEnroll) {
                                    inputEnroll.value = decodedText;
                                    const btnRekam = document.getElementById('btn-rekam');
                                    btnRekam.disabled = false;
                                    btnRekam.className = "bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-lg transition-transform hover:scale-105 active:scale-95 shadow-lg shadow-blue-500/30 cursor-pointer";
                                    btnRekam.innerText = "REKAM WAJAH";
                                    
                                    try { new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play(); } catch(e){}
                                }
                            } else {
                                // MODE ABSEN: QR berfungsi untuk mencatat kehadiran
                                const nowLocal = new Date();
                                const hariIni = nowLocal.getFullYear() + '-' + String(nowLocal.getMonth() + 1).padStart(2, '0') + '-' + String(nowLocal.getDate()).padStart(2, '0');
                                let logHarian = JSON.parse(localStorage.getItem('gateway_absen_' + hariIni) || '[]');
                                const nis = decodedText.split('|')[0];
                                
                                if (logHarian.includes(nis)) {
                                    tolakAbsenGanda(decodedText);
                                } else {
                                    logHarian.push(nis);
                                    localStorage.setItem('gateway_absen_' + hariIni, JSON.stringify(logHarian));
                                    tambahLogKehadiran(decodedText, "QR");
                                }
                            }

                            setTimeout(() => { window.lastScanned = null; }, 3000);
                        }
                    },
                    (errorMessage) => { }
                );

                cameraLoading.style.display = 'none';
                scanLine.classList.remove('hidden');

                const videoEl = document.querySelector('#videoFeed video');
                if (videoEl) {
                    videoEl.addEventListener('playing', () => {
                        const canvas = faceapi.createCanvasFromMedia(videoEl);
                        document.getElementById('videoFeed').append(canvas);
                        const displaySize = { width: videoEl.videoWidth, height: videoEl.videoHeight };
                        faceapi.matchDimensions(canvas, displaySize);

                        let bufferWajah = {}; 
                        let wajahTerkonfirmasiTerakhir = ""; 
                        
                        setInterval(async () => {
                            const detections = await faceapi.detectAllFaces(videoEl, new faceapi.TinyFaceDetectorOptions())
                                .withFaceLandmarks()
                                .withFaceDescriptors();
                                
                            const resizedDetections = faceapi.resizeResults(detections, displaySize);
                            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
                            faceapi.draw.drawDetections(canvas, resizedDetections);
                            
                            if (detections.length > 0) {
                                const sidikWajah = detections[0].descriptor;

                                // ========================================================
                                // JIKA SEDANG PROSES MEREKAM WAJAH BARU (MODE DAFTAR - LEVEL BANKING)
                                // ========================================================
                                if (isEnrolling && currentMode === 'daftar') {
                                    const btnRekam = document.getElementById('btn-rekam');
                                    const landmarks = deteksiPertama.landmarks;
                                    
                                    // 1. Mengambil titik koordinat mata dan hidung
                                    const mataKiri = landmarks.getLeftEye();
                                    const mataKanan = landmarks.getRightEye();
                                    const hidung = landmarks.getNose();
                                    
                                    // Mencari titik tengah mata
                                    const tengahMataKiri = mataKiri.reduce((acc, pt) => ({x: acc.x + pt.x, y: acc.y + pt.y}), {x:0, y:0});
                                    tengahMataKiri.x /= mataKiri.length; tengahMataKiri.y /= mataKiri.length;
                                    
                                    const tengahMataKanan = mataKanan.reduce((acc, pt) => ({x: acc.x + pt.x, y: acc.y + pt.y}), {x:0, y:0});
                                    tengahMataKanan.x /= mataKanan.length; tengahMataKanan.y /= mataKanan.length;

                                    // 2. CEK KEMIRINGAN (ROLL) - Apakah kepala miring ke bahu?
                                    const selisihY = tengahMataKanan.y - tengahMataKiri.y;
                                    const selisihX = tengahMataKanan.x - tengahMataKiri.x;
                                    const sudutMiring = (Math.atan2(selisihY, selisihX) * 180) / Math.PI;
                                    const kepalaMiring = Math.abs(sudutMiring) > 8; // Toleransi maksimal 8 derajat
                                    
                                    // 3. CEK TOLEHAN (YAW) - Apakah menoleh ke kiri/kanan?
                                    const titikHidungAtas = hidung[0]; // Titik pangkal hidung di antara mata
                                    const jarakHidungKeKiri = Math.abs(titikHidungAtas.x - tengahMataKiri.x);
                                    const jarakHidungKeKanan = Math.abs(titikHidungAtas.x - tengahMataKanan.x);
                                    // Jika rasio jarak hidung ke mata kiri/kanan tidak seimbang, berarti dia menoleh
                                    const rasioNoleh = Math.max(jarakHidungKeKiri, jarakHidungKeKanan) / Math.min(jarakHidungKeKiri, jarakHidungKeKanan);
                                    const kepalaNoleh = rasioNoleh > 1.4; // Toleransi rasio

                                    // ==========================================
                                    // SISTEM FEEDBACK PINTAR (SUTRADARA AI)
                                    // ==========================================
                                    if (scoreAkurasi < 0.85) {
                                        // Gagal kejernihan (buram/gelap)
                                        btnRekam.innerHTML = `<i class="fa-solid fa-lightbulb text-amber-300 mr-2"></i> TERLALU GELAP / BURAM`;
                                        btnRekam.className = "bg-slate-700 border border-amber-500/50 text-amber-400 font-bold py-2 px-6 rounded-lg shadow-lg";
                                        enrollBuffer = 0; // Reset progres
                                    } 
                                    else if (kepalaMiring) {
                                        // Gagal karena miring
                                        btnRekam.innerHTML = `<i class="fa-solid fa-rotate-left text-rose-300 mr-2"></i> TEGAKKAN KEPALA ANDA`;
                                        btnRekam.className = "bg-slate-700 border border-rose-500/50 text-rose-400 font-bold py-2 px-6 rounded-lg shadow-lg";
                                        enrollBuffer = 0;
                                    }
                                    else if (kepalaNoleh) {
                                        // Gagal karena menoleh
                                        btnRekam.innerHTML = `<i class="fa-solid fa-arrows-left-right text-rose-300 mr-2"></i> TATAP LURUS KE KAMERA`;
                                        btnRekam.className = "bg-slate-700 border border-rose-500/50 text-rose-400 font-bold py-2 px-6 rounded-lg shadow-lg";
                                        enrollBuffer = 0;
                                    }
                                    else {
                                        // SEMUA SYARAT TERPENUHI - LURUS & JERNIH! Mulai memotret.
                                        enrollBuffer++;
                                        let persen = Math.floor((enrollBuffer / 20) * 100); // Butuh 20 frame stabil (±2.5 detik)
                                        if (persen > 100) persen = 100;
                                        
                                        btnRekam.innerHTML = `<i class="fa-solid fa-crosshairs fa-spin text-white mr-2"></i> TAHAN POSISI... ${persen}%`;
                                        btnRekam.className = "bg-emerald-500 border border-emerald-400 text-white font-black py-2 px-6 rounded-lg shadow-[0_0_15px_rgba(16,185,129,0.5)] transition-all scale-105";
                                        
                                        if (enrollBuffer >= 20) {
                                            // SUKSES TERKAM: Jepret dan kirim ke server
                                            kirimSidikWajahKePusat(enrollTargetId, sidikWajah);
                                            isEnrolling = false; 
                                            enrollBuffer = 0; 
                                            
                                            // Reset tombol ke keadaan awal
                                            const inputEnroll = document.getElementById('input-enroll-id');
                                            inputEnroll.value = "";
                                            btnRekam.disabled = true;
                                            btnRekam.className = "bg-slate-700 text-slate-500 font-bold py-2 px-6 rounded-lg shadow-lg cursor-not-allowed transition-all scale-100";
                                            btnRekam.innerText = "REKAM WAJAH";
                                        }
                                    }
                                    return; // Stop eksekusi agar tidak lanjut ke bawah
                                } 
                                
                                // PROSES PENGENALAN WAJAH HARIAN (Hanya Aktif di Mode Absen)
                                if (currentMode === 'absen' && faceMatcher && !window.faceScanned) {
                                    const bestMatch = faceMatcher.findBestMatch(sidikWajah);
                                    
                                    if (bestMatch.label !== "unknown") {
                                        const labelMentah = bestMatch.label;
                                        if (labelMentah === wajahTerkonfirmasiTerakhir) return; 

                                        bufferWajah[labelMentah] = (bufferWajah[labelMentah] || 0) + 1;
                                        
                                        if (bufferWajah[labelMentah] >= 3) {
                                            window.faceScanned = true;
                                            wajahTerkonfirmasiTerakhir = labelMentah; 
                                            bufferWajah = {}; 

                                            const nisSiswa = labelMentah.split('|')[0];
                                            const nowLocal = new Date();
                                            const hariIni = nowLocal.getFullYear() + '-' + String(nowLocal.getMonth() + 1).padStart(2, '0') + '-' + String(nowLocal.getDate()).padStart(2, '0');
                                            let logHarian = JSON.parse(localStorage.getItem('gateway_absen_' + hariIni) || '[]');
                                            
                                            if (logHarian.includes(nisSiswa)) {
                                                tolakAbsenGanda(labelMentah);
                                            } else {
                                                logHarian.push(nisSiswa);
                                                localStorage.setItem('gateway_absen_' + hariIni, JSON.stringify(logHarian));
                                                tambahLogKehadiran(labelMentah, "DAFTAR WAJAH");
                                            }

                                            setTimeout(() => { window.faceScanned = false; }, 4000);
                                        }
                                    } else {
                                        bufferWajah = {};
                                        setTimeout(() => { wajahTerkonfirmasiTerakhir = ""; }, 5000); 
                                    }
                                }
                            } else {
                                setTimeout(() => { wajahTerkonfirmasiTerakhir = ""; }, 2000);
                            }
                        }, 150);
                    });
                }
            } catch (err) {
                btnStart.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> COBA LAGI`;
                btnStart.disabled = false;
                btnStart.classList.replace('bg-emerald-500', 'bg-rose-500');
                errorText.innerHTML = `<span class="text-rose-400 font-bold block mt-2 text-lg">ERROR: ${err.name || err.message || err}</span>`;
            }
        }
        
        function toggleFullScreenGateway() {
            const icon = document.getElementById('fs-icon');
            if (!document.fullscreenElement) {
                const docEl = document.documentElement;
                const req = docEl.requestFullscreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
                if(req) {
                    req.call(docEl).catch(err => console.log(err));
                    if (icon) icon.className = "fa-solid fa-compress text-lg";
                }
            } else {
                const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                if(exit) {
                    exit.call(document).catch(err => console.log(err));
                    if (icon) icon.className = "fa-solid fa-expand text-lg";
                }
            }
        }
    </script>
</body>
