<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART TEACHER: Gateway Station</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #scanner-container { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; background: #000; border-radius: 0.75rem; overflow: hidden; }
        #videoFeed { width: 100%; max-width: 640px; text-align: center; }
        #videoFeed__dashboard { display: none !important; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col overflow-hidden">
    
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 py-4 px-8 flex justify-between items-center z-10 shadow-lg">
        <div class="flex items-center gap-4">
            <div class="bg-emerald-500 w-12 h-12 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/30">
                <i class="fa-solid fa-face-viewfinder text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white">SMART TEACHER</h1>
                <p class="text-emerald-400 font-semibold text-sm tracking-widest uppercase">Gateway Station (Smart Bind)</p>
            </div>
        </div>
        <div class="text-right hidden md:block">
            <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Status Sistem</p>
            <p id="ai-status" class="text-amber-400 font-bold text-sm flex items-center justify-end gap-2">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Menunggu...
            </p>
        </div>
    </header>

    <main class="flex-1 flex p-6 gap-6 h-full">
        <!-- AREA KAMERA -->
        <section class="flex-[3] flex flex-col gap-4 relative">
            <div class="bg-slate-800 rounded-2xl border border-slate-700 p-4 flex-1 flex flex-col relative shadow-2xl">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-bold text-slate-200"><i class="fa-solid fa-camera-viewfinder text-emerald-400 mr-2"></i> Pemindai Utama</h2>
                    <span id="face-db-status" class="text-xs font-bold bg-slate-700 text-slate-300 px-3 py-1 rounded-full">0 Wajah Terdaftar</span>
                </div>
                
                <div id="scanner-container">
                    <div id="videoFeed"></div>
                </div>

                <div id="camera-loading" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900/95 rounded-2xl m-4">
                    <button onclick="mulaiSistem()" id="btn-start" class="bg-emerald-500 text-white px-8 py-4 rounded-xl font-extrabold shadow-lg hover:scale-105 transition-transform">
                        <i class="fa-solid fa-power-off mr-2"></i> NYALAKAN SISTEM
                    </button>
                    <p class="mt-4 text-slate-400 text-sm font-semibold text-center">Pindai QR Code, lalu singkirkan HP dan tatap kamera.</p>
                </div>
            </div>
        </section>

        <!-- AREA LOG DATA -->
        <section class="flex-[2] flex flex-col gap-4">
            <div class="bg-slate-800 rounded-2xl border border-slate-700 p-5 flex-1 flex flex-col shadow-2xl">
                <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
                    <h2 class="font-bold text-slate-200 text-lg"><i class="fa-solid fa-list-check text-emerald-400 mr-2"></i> Log Kehadiran</h2>
                    <span class="bg-slate-700 text-slate-300 text-xs font-bold py-1 px-3 rounded-full" id="total-scan">0 Terpindai</span>
                </div>
                <div id="log-container" class="flex-1 overflow-y-auto space-y-3 pr-2"></div>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>

    <script>
        const cameraLoading = document.getElementById('camera-loading');
        const logContainer = document.getElementById('log-container');
        const totalScan = document.getElementById('total-scan');
        const btnStart = document.getElementById('btn-start');
        const aiStatus = document.getElementById('ai-status');
        const faceDbStatus = document.getElementById('face-db-status');
        
        let scanCount = 0;
        let registeredDescriptors = [];
        let faceMatcher = null;
        let lastFaceLog = 0;
        
        // Memori sementara untuk menyimpan nama dari QR yang baru discan
        window.pendingRegistration = null;

        const dataSiswaDummy = {
            "QR-12345": { nama: "Muh Nashir", kelas: "IX-B", foto: "https://ui-avatars.com/api/?name=Muh+Nashir&background=10b981&color=fff" },
            "QR-67890": { nama: "Raisya", kelas: "VII-A", foto: "https://ui-avatars.com/api/?name=Raisya&background=3b82f6&color=fff" }
        };

        function tambahLogKehadiran(qrData, metode = "QR", warnaMetode = "text-emerald-400") {
            let siswa = dataSiswaDummy[qrData] || Object.values(dataSiswaDummy).find(s => s.nama === qrData) || { nama: qrData, kelas: "Tamu", foto: `https://ui-avatars.com/api/?name=${qrData}&background=f59e0b&color=fff` };
            const sekarang = new Date();
            const waktu = sekarang.getHours().toString().padStart(2, '0') + ':' + sekarang.getMinutes().toString().padStart(2, '0');
            
            const logItem = document.createElement('div');
            logItem.className = "bg-slate-700/50 border border-emerald-500/30 rounded-xl p-4 flex items-center gap-4 shadow-md";
            logItem.innerHTML = `
                <img src="${siswa.foto}" class="w-12 h-12 rounded-full border-2 border-emerald-500">
                <div class="flex-1">
                    <h3 class="font-bold text-white">${siswa.nama}</h3>
                    <p class="text-slate-400 text-xs">Kelas ${siswa.kelas}</p>
                </div>
                <div class="text-right">
                    <p class="text-emerald-400 font-black text-lg">${waktu}</p>
                    <p class="text-[10px] uppercase font-bold ${warnaMetode}">${metode}</p>
                </div>
            `;
            logContainer.insertBefore(logItem, logContainer.firstChild);
            scanCount++;
            totalScan.textContent = `${scanCount} Terpindai`;
            new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play().catch(e=>console.log(e));
        }

        async function mulaiSistem() {
            btnStart.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Menyiapkan AI...`;
            btnStart.disabled = true;

            try {
                aiStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memuat AI Wajah...`;
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                aiStatus.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-shield-check"></i> Face ID Aktif</span>`;

                const html5QrCode = new Html5Qrcode("videoFeed");
                await html5QrCode.start(
                    { facingMode: "user" },
                    { fps: 15, qrbox: { width: 250, height: 250 }, aspectRatio: 1.333334, formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ] },
                    (decodedText) => {
                        if (!window.lastScanned || window.lastScanned !== decodedText) {
                            window.lastScanned = decodedText;
                            const namaSiswa = dataSiswaDummy[decodedText] ? dataSiswaDummy[decodedText].nama : decodedText;
                            const isRegistered = registeredDescriptors.some(d => d.label === namaSiswa);

                            if (!isRegistered) {
                                // Simpan nama ke memori sementara, lalu suruh user singkirkan HP
                                window.pendingRegistration = namaSiswa;
                                alert(`Mendeteksi QR: ${namaSiswa}.\n\nSekarang SINGKIRKAN HP dan TATAP KAMERA untuk menyimpan wajah!`);
                                
                                // Batas waktu 15 detik sebelum memori direset jika wajah tidak muncul
                                setTimeout(() => { window.pendingRegistration = null; }, 15000);
                            } else {
                                tambahLogKehadiran(decodedText, "QR");
                            }

                            setTimeout(() => { window.lastScanned = null; }, 4000);
                        }
                    },
                    (errorMessage) => {}
                );

                cameraLoading.style.display = 'none';

                const videoEl = document.querySelector('#videoFeed video');
                if (videoEl) {
                    const canvas = faceapi.createCanvasFromMedia(videoEl);
                    document.getElementById('scanner-container').append(canvas);
                    const displaySize = { width: videoEl.clientWidth, height: videoEl.clientHeight };
                    faceapi.matchDimensions(canvas, displaySize);

                    setInterval(async () => {
                        const detections = await faceapi.detectAllFaces(videoEl, new faceapi.TinyFaceDetectorOptions())
                            .withFaceLandmarks()
                            .withFaceDescriptors();

                        const resizedDetections = faceapi.resizeResults(detections, displaySize);
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        faceapi.draw.drawDetections(canvas, resizedDetections);

                        if (detections.length > 0) {
                            const currentFaceDescriptor = detections[0].descriptor;

                            // PROSES 1: Mendaftarkan Wajah (Jika ada data QR yang baru discan)
                            if (window.pendingRegistration) {
                                const newLabeledDescriptor = new faceapi.LabeledFaceDescriptors(window.pendingRegistration, [currentFaceDescriptor]);
                                registeredDescriptors.push(newLabeledDescriptor);
                                faceMatcher = new faceapi.FaceMatcher(registeredDescriptors, 0.55);
                                
                                faceDbStatus.textContent = `${registeredDescriptors.length} Wajah Terdaftar`;
                                tambahLogKehadiran(window.pendingRegistration, "REGISTRASI WAJAH SUKSES", "text-amber-400");
                                
                                window.pendingRegistration = null; // Kosongkan memori setelah sukses
                            } 
                            // PROSES 2: Absen Otomatis via Wajah (Jika sudah terdaftar)
                            else if (faceMatcher) {
                                const bestMatch = faceMatcher.findBestMatch(currentFaceDescriptor);
                                if (bestMatch.label !== 'unknown' && bestMatch.distance < 0.55) {
                                    const drawBox = new faceapi.draw.DrawBox(resizedDetections[0].detection.box, { label: bestMatch.label });
                                    drawBox.draw(canvas);

                                    const now = Date.now();
                                    if (now - lastFaceLog > 10000) { // Cooldown 10 detik
                                        tambahLogKehadiran(bestMatch.label, "FACE ID", "text-emerald-400");
                                        lastFaceLog = now;
                                    }
                                }
                            }
                        }
                    }, 1000); 
                }

            } catch (err) {
                btnStart.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> ERROR!`;
                btnStart.disabled = false;
                btnStart.classList.replace('bg-emerald-500', 'bg-rose-500');
            }
        }
    </script>
</body>
</html>
