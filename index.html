<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART TEACHER: Gateway Station</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Memastikan area video dan scanner pas di tengah */
        #videoFeed {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #videoFeed video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }
        /* Merapikan posisi kotak merah bawaan html5-qrcode agar pas di tengah */
        #videoFeed__scan_region {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #videoFeed__dashboard {
            position: absolute;
            bottom: 10px;
            background: rgba(15, 23, 42, 0.8) !important;
            padding: 8px !important;
            border-radius: 8px;
            z-index: 40;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col overflow-hidden">
    
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 py-4 px-8 flex justify-between items-center z-10 shadow-lg">
        <div class="flex items-center gap-4">
            <div class="bg-emerald-500 w-12 h-12 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/30">
                <i class="fa-solid fa-graduation-cap text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white">SMART TEACHER</h1>
                <p class="text-emerald-400 font-semibold text-sm tracking-widest uppercase">Gateway Station (Centered UI)</p>
            </div>
        </div>
        <div class="text-right hidden md:block">
            <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Status Sistem</p>
            <p id="ai-status" class="text-amber-400 font-bold text-sm flex items-center justify-end gap-2">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Menunggu Aktivasi...
            </p>
        </div>
    </header>

    <main class="flex-1 flex p-6 gap-6 h-full">
        <!-- AREA KAMERA -->
        <section class="flex-[3] flex flex-col gap-4">
            <div class="bg-slate-800 rounded-2xl border border-slate-700 p-4 flex-1 flex flex-col relative overflow-hidden shadow-2xl">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-bold text-slate-200"><i class="fa-solid fa-camera-viewfinder text-emerald-400 mr-2"></i> Pemindai Utama (QR & Wajah)</h2>
                </div>
                
                <div class="relative w-full h-full bg-black rounded-xl overflow-hidden flex items-center justify-center border-2 border-slate-700">
                    
                    <!-- Wadah Kamera -->
                    <div id="videoFeed" class="w-full h-full"></div>

                    <!-- TOMBOL PEMANCING KAMERA -->
                    <div id="camera-loading" class="absolute z-50 flex flex-col items-center justify-center w-full h-full bg-slate-900/95">
                        <button onclick="mulaiSistem()" id="btn-start" class="bg-emerald-500 text-white px-8 py-4 rounded-xl font-extrabold shadow-lg shadow-emerald-500/30 mb-4 hover:scale-105 active:scale-95 transition-transform">
                            <i class="fa-solid fa-power-off mr-2"></i> NYALAKAN SISTEM
                        </button>
                        <p id="error-text" class="font-semibold text-sm text-center px-4 text-slate-400">Pastikan izin kamera sudah diaktifkan di browser tablet.</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- AREA LOG DATA -->
        <section class="flex-[2] flex flex-col gap-4">
            <div class="bg-slate-800 rounded-2xl border border-slate-700 p-5 flex-1 flex flex-col shadow-2xl">
                <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
                    <h2 class="font-bold text-slate-200 text-lg"><i class="fa-solid fa-list-check text-emerald-400 mr-2"></i> Log Kehadiran</h2>
                    <span class="bg-slate-700 text-slate-300 text-xs font-bold py-1 px-3 rounded-full" id="total-scan">0 Terpindai</span>
                </div>
                <div id="log-container" class="flex-1 overflow-y-auto space-y-3 pr-2"></div>
            </div>
        </section>
    </main>

    <!-- Library QR Code & Face API -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>

    <script>
        const cameraLoading = document.getElementById('camera-loading');
        const logContainer = document.getElementById('log-container');
        const totalScan = document.getElementById('total-scan');
        const errorText = document.getElementById('error-text');
        const btnStart = document.getElementById('btn-start');
        const aiStatus = document.getElementById('ai-status');
        let scanCount = 0;

        const dataSiswaDummy = {
            "QR-12345": { nama: "Muh Nashir", kelas: "IX-B", foto: "https://ui-avatars.com/api/?name=Muh+Nashir&background=10b981&color=fff" },
            "QR-67890": { nama: "Raisya", kelas: "VII-A", foto: "https://ui-avatars.com/api/?name=Raisya&background=3b82f6&color=fff" }
        };

        function tambahLogKehadiran(qrData, metode = "QR") {
            const siswa = dataSiswaDummy[qrData] || { nama: qrData, kelas: "Tamu", foto: `https://ui-avatars.com/api/?name=${qrData}&background=f59e0b&color=fff` };
            const sekarang = new Date();
            const waktu = sekarang.getHours().toString().padStart(2, '0') + ':' + sekarang.getMinutes().toString().padStart(2, '0');
            
            const logItem = document.createElement('div');
            logItem.className = "bg-slate-700/50 border border-emerald-500/30 rounded-xl p-4 flex items-center gap-4 shadow-md";
            logItem.innerHTML = `
                <img src="${siswa.foto}" class="w-12 h-12 rounded-full border-2 border-emerald-500 shadow-sm">
                <div class="flex-1">
                    <h3 class="font-bold text-white text-md">${siswa.nama}</h3>
                    <p class="text-slate-400 text-xs font-semibold">Kelas ${siswa.kelas}</p>
                </div>
                <div class="text-right">
                    <p class="text-emerald-400 font-black text-lg">${waktu}</p>
                    <p class="text-slate-500 text-[10px] uppercase font-bold tracking-wider">Hadir via ${metode}</p>
                </div>
            `;
            logContainer.insertBefore(logItem, logContainer.firstChild);
            scanCount++;
            totalScan.textContent = `${scanCount} Terpindai`;
            new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play().catch(e=>console.log(e));
        }

        async function mulaiSistem() {
            btnStart.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Menyiapkan Sistem...`;
            btnStart.disabled = true;

            try {
                aiStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memuat AI Wajah...`;
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL)
                ]);
                aiStatus.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-circle-check"></i> Sistem Siap</span>`;

                const html5QrCode = new Html5Qrcode("videoFeed");
                await html5QrCode.start(
                    { facingMode: "user" },
                    { fps: 15, qrbox: { width: 220, height: 220 } },
                    (decodedText) => {
                        if (!window.lastScanned || window.lastScanned !== decodedText) {
                            window.lastScanned = decodedText;
                            tambahLogKehadiran(decodedText, "QR");
                            setTimeout(() => { window.lastScanned = null; }, 3000);
                        }
                    },
                    (errorMessage) => {}
                );

                cameraLoading.style.display = 'none';

                const videoEl = document.querySelector('#videoFeed video');
                if (videoEl) {
                    const canvas = faceapi.createCanvasFromMedia(videoEl);
                    document.getElementById('videoFeed').append(canvas);
                    const displaySize = { width: videoEl.videoWidth || 640, height: videoEl.videoHeight || 480 };
                    faceapi.matchDimensions(canvas, displaySize);

                    setInterval(async () => {
                        const detections = await faceapi.detectAllFaces(videoEl, new faceapi.TinyFaceDetectorOptions());
                        const resizedDetections = faceapi.resizeResults(detections, displaySize);
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        faceapi.draw.drawDetections(canvas, resizedDetections);
                    }, 100);
                }

            } catch (err) {
                btnStart.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> COBA LAGI`;
                btnStart.disabled = false;
                btnStart.classList.replace('bg-emerald-500', 'bg-rose-500');
                errorText.innerHTML = `<span class="text-rose-400 font-bold block mt-2">ERROR: ${err.message || err}</span>`;
            }
        }
    </script>
</body>
</html>
