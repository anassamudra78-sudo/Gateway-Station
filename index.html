<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Gateway - Absensi</title>

    <!-- Konfigurasi PWA & Ikon Khusus Terminal Absen -->
    <link rel="icon" type="image/png" sizes="192x192" href="logo-absen.png">
    <link rel="apple-touch-icon" href="logo-absen.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Smart Gateway">
    <meta name="application-name" content="Smart Gateway">
    <meta name="theme-color" content="#0f172a"> 

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans select-none">

    <!-- Header & Logo -->
    <div class="mb-6 flex flex-col items-center z-10">
        <img src="logo-absen.png" alt="Smart Gateway Logo" class="w-20 h-20 rounded-2xl mb-3 shadow-[0_0_15px_rgba(16,185,129,0.2)]">
        <h1 class="text-2xl font-bold tracking-widest text-emerald-400">SMART GATEWAY</h1>
        <p class="text-slate-400 text-sm mt-1">Terminal Absensi Terintegrasi</p>
    </div>

    <!-- Area Kamera Scanner -->
    <div class="relative w-full max-w-md aspect-[3/4] bg-slate-800 rounded-3xl border-4 border-slate-700 overflow-hidden shadow-2xl flex flex-col items-center justify-center">
        
        <!-- Video Stream Kamera -->
        <video id="kamera-stream" autoplay playsinline class="absolute inset-0 w-full h-full object-cover z-0 hidden"></video>

        <!-- Pesan Loading Kamera -->
        <div id="kamera-loading" class="text-center z-10">
            <svg class="w-12 h-12 text-slate-500 mx-auto mb-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            <p class="text-slate-400 font-medium">Mengaktifkan Kamera...</p>
        </div>

        <!-- Ornamen UI Scanner -->
        <div class="absolute top-4 left-4 w-12 h-12 border-t-4 border-l-4 border-emerald-500 rounded-tl-xl z-20"></div>
        <div class="absolute top-4 right-4 w-12 h-12 border-t-4 border-r-4 border-emerald-500 rounded-tr-xl z-20"></div>
        <div class="absolute bottom-4 left-4 w-12 h-12 border-b-4 border-l-4 border-emerald-500 rounded-bl-xl z-20"></div>
        <div class="absolute bottom-4 right-4 w-12 h-12 border-b-4 border-r-4 border-emerald-500 rounded-br-xl z-20"></div>

        <!-- Garis Scan Laser -->
        <div class="absolute w-full h-1 bg-emerald-500 shadow-[0_0_15px_#10b981] animate-[scan_3s_ease-in-out_infinite] z-20"></div>
    </div>

    <!-- Status Bar -->
    <div class="mt-8 text-center z-10">
        <div id="status-sistem" class="inline-flex items-center justify-center px-5 py-2 bg-emerald-500/10 text-emerald-400 rounded-full text-sm font-medium border border-emerald-500/20">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>
            Menunggu Wajah...
        </div>
        <p class="text-slate-600 text-xs mt-4">&copy; 2026 Smart Teacher Ecosystem</p>
    </div>

    <style>
        @keyframes scan {
            0%, 100% { top: 10%; opacity: 0; }
            10%, 90% { opacity: 1; }
            50% { top: 90%; }
        }
    </style>

    <!-- Script Integrasi Kamera & LocalStorage (Dari Pembahasan Pagi) -->
    <script>
        const video = document.getElementById('kamera-stream');
        const loading = document.getElementById('kamera-loading');
        const statusSistem = document.getElementById('status-sistem');

        // Mengaktifkan Kamera Depan
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                video.srcObject = stream;
                video.classList.remove('hidden');
                loading.classList.add('hidden');
            } catch (err) {
                console.error("Error akses kamera: ", err);
                loading.innerHTML = `<p class="text-red-400">Gagal mengakses kamera.<br>Pastikan izin diberikan.</p>`;
                statusSistem.className = "inline-flex items-center justify-center px-5 py-2 bg-red-500/10 text-red-400 rounded-full text-sm font-medium border border-red-500/20";
                statusSistem.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-red-500 mr-2"></span>Kamera Error`;
            }
        }

        // Simulasi LocalStorage Handler (Menyimpan Log Absen)
        function simpanAbsen(nama, id_siswa) {
            let dataAbsen = JSON.parse(localStorage.getItem('smart_gateway_logs')) || [];
            const waktu = new Date().toLocaleString('id-ID');
            
            dataAbsen.push({ nama: nama, id: id_siswa, waktu: waktu });
            localStorage.setItem('smart_gateway_logs', JSON.stringify(dataAbsen));
            
            console.log(`[Smart Gateway] Data absen ${nama} tersimpan di LocalStorage!`);
        }

        // Jalankan kamera saat halaman dimuat
        window.addEventListener('load', () => {
            startCamera();
            // Cek inisialisasi LocalStorage
            if(!localStorage.getItem('smart_gateway_logs')) {
                localStorage.setItem('smart_gateway_logs', JSON.stringify([]));
            }
        });
    </script>
</body>
</html>
