<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART TEACHER: Gateway Station</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #scanner-container { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; background: #000; border-radius: 0.75rem; overflow: hidden; position: relative; }
        #videoFeed { width: 100%; max-width: 640px; text-align: center; }
        #videoFeed__dashboard { display: none !important; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        #toast-notif { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; padding: 15px 25px; font-weight: 800; font-size: 1.1rem; border-radius: 12px; z-index: 50; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 80%; }
        
        /* Dukungan warna background saat mode full screen aktif */
        :fullscreen, ::backdrop { background-color: #0f172a; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col overflow-hidden relative" id="main-body">
    
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 py-4 px-8 flex justify-between items-center z-10 shadow-lg">
        <div class="flex items-center gap-4">
            <div class="bg-emerald-500 w-12 h-12 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/30">
                <i class="fa-solid fa-shield-halved text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white">SMART TEACHER</h1>
                <p class="text-emerald-400 font-semibold text-sm tracking-widest uppercase">Gateway Station (Kiosk Mode)</p>
            </div>
        </div>
        <div class="flex items-center gap-6">
            <!-- Tombol Full Screen -->
            <button onclick="toggleFullScreen()" id="btn-fullscreen" class="bg-indigo-500 hover:bg-indigo-400 text-white px-4 py-2.5 rounded-lg font-bold shadow-lg shadow-indigo-500/30 transition-all flex items-center gap-2 active:scale-95">
                <i class="fa-solid fa-expand" id="icon-fullscreen"></i> <span class="hidden md:inline" id="text-fullscreen">Layar Penuh</span>
            </button>
            <div class="text-right hidden md:block border-l border-slate-700 pl-6">
                <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Status Sistem</p>
                <p id="ai-status" class="text-amber-400 font-bold text-sm flex items-center justify-end gap-2">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Menunggu...
                </p>
            </div>
        </div>
    </header>

    <main class="flex-1 flex p-6 gap-6 h-full">
        <!-- AREA KAMERA -->
        <section class="flex-[3] flex flex-col gap-4 relative">
            <div class="bg-slate-800 rounded-2xl border border-slate-700 p-4 flex-1 flex flex-col relative shadow-2xl">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-bold text-slate-200"><i class="fa
